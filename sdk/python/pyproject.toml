[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "codex-app-server-sdk"
version = "0.2.0"
description = "Python SDK for Codex app-server v2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenClaw Assistant" }]
keywords = ["codex", "json-rpc", "sdk", "llm", "app-server"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["pydantic>=2.12"]

[project.urls]
Homepage = "https://github.com/openai/codex"
Repository = "https://github.com/openai/codex"
Issues = "https://github.com/openai/codex/issues"

[project.optional-dependencies]
# ruff is pinned exactly: update_sdk_artifacts.py formats generated output with `ruff-format`
# and tests/test_contract_generation.py asserts byte equality, so a formatter bump must be a
# deliberate change that regenerates generated/v2_all.py, generated/notification_registry.py
# and api.py in the same commit. 0.16.8 and 0.17.3 produced byte-identical output (2026-10-28).
dev = ["pytest>=8.0", "datamodel-code-generator==0.31.2", "ruff==0.17.3"]

[tool.hatch.build]
exclude = [
  ".venv/**",
  ".venv2/**",
  ".pytest_cache/**",
  "dist/**",
  "build/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_app_server"]
include = [
  "src/codex_app_server/py.typed",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/codex_app_server/**",
  "README.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "RELEASE_CHECKLIST.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
